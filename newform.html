<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information</title>
</head>
<body>
    <form action="form.html"method="get">
        <P>
        <label for="date">Date:</label>
        <input type="date" name="dob" id="dob">
        </P>
        <P>
            <label for="time">Time:</label>
            <input type="time" name="time" id="time">
            </P>
            <P>
                <label for="date-time">Meeting:</label>
                <input type="datetime-local" name="meeting" id="meeting">
                </P>
            <P>
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" min="17" max="25">
                </P>
                <P>
                    <label for="skill">Looks:</label>
                    <input type="range" name="looks" id="looks" min="1" max="10">
                    </P>
                    <P>
                        <label for="color">Color:</label>
                        <input type="color" name="color" id="color">
                        </P>
                        <P>
                            <label for="upload">Uplod file:</label>
                            <input type="file" name="file" id="file">
                            </P>
                    <P>
                      <label for="website">Website:</label>
                      <input type="url" name="url" id="url">
                    </P>
                    <P>
                        <label for="phonenumber">Phone Number:</label>
                        <input type="tel" name="phonenumber" id="phonenumber" placeholder="123-456-7890">
                        </P>
                        <P>
                            <label for="search">Search:</label>
                            <input type="search" name="search" id="search" placeholder="search here">
                            </P>
                            <select name="" id=""></select>
            <button type="submit">Submit</button>
        </p>
    </form>
</body>
</html>
