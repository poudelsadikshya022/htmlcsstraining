<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
   <link rel="stylesheet" href="header.css">
   <style>
    body{
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
}
.header{
    background-color:#232f3e;
    color:white
    padding: 10px;
    display: flex;
    align-items: center;
    gap:15px;
}
.logo{
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: inline;
    margin-right: 20px;
}
.logo img{
    width: 40px;
    height:40px;
}
.location{
    font-size: 12px;
}
.search{
    flex:1;
    display:flex;
}
.search input{
    padding: 6px;
    width: 100%;
    border: none;
    border-radius: 4px 0 0 4px;
}
.search button{
    padding: 6px 10 px;
    border: none;
    background-color:orange ;
    cursor:pointer;
}
.menu ul{
    list-style: none;
    display: flex;
    margin: 0;
    padding: ;
}
.menu li{
    margin-left:15px;
}
.menu a{
    color:white;
    text-decoration: none;
}
 .menu a:hover{
    color: orange;
    text-decoration: underline;
 }
 .logo :hover{
    cursor: pointer;
    color: orange;
 }
 .location :hover{
    text-decoration: underline;
    cursor: pointer;
    color: darkorange;
 }
 .menu a,
 .search button,
 .logo{
    transition: all 1s ease-in-out;
 }
.search input: :focus{
    border:2px solid orange
}
 </style>
  </head>
<body>
    <div class="header">
        <div class="logo">
            Amazon
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/06/Amazon_2024.svg" alt="Amazon_logo" srcset="">

        </div>
        <div>
            <form class="Search">
                <input type="text" name="search" id="search" placeholder="Search Product"> 
            </form>
        </div>


    </div>
    <div class="menu">
        <ul>
        <a href="#">Home</a>
        <a href="#">Orders</a>
        <a href="#">Cart</a>
        </ul>
    </div>
    </div>
      
</body>
</html>
